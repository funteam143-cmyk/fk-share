name: Build FK Share APK
on:
  push:
    paths:
      - ".github/workflows/build-fk-share.yml"
      - "fk-share-source.zip"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Extract project and create debug signing key
        run: |
          set -e
          mkdir android-project
          unzip -q fk-share-source.zip -d android-project
          keytool -genkeypair -v -keystore android-project/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Build debug APK
        working-directory: android-project
        run: |
          gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FK-Share-APK
          path: android-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

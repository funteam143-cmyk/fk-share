name: Build FK Share APK
on:
  push:
    paths:
      - ".github/workflows/build-fk-share.yml"
      - "source/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Create debug signing key
        run: |
          keytool -genkeypair -v -keystore source/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Run unit tests and build debug APK
        working-directory: source
        run: |
          gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FK-Share-APK
          path: source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error


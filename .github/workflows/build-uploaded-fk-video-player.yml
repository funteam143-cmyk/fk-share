name: Build uploaded FK Video Player ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'FKVideoPlayer_fixed_source.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract fixed source
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q FKVideoPlayer_fixed_source.zip -d buildsrc

      - name: Build debug APK
        working-directory: buildsrc
        run: gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: FKVideoPlayer-fixed-debug
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Build APK

on:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Extract project ZIP
        run: |
          set -e
          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found!"
            exit 1
          fi

          mkdir android-project
          unzip -q "$ZIP_FILE" -d android-project

          test -f android-project/settings.gradle.kts
          echo "Project extracted successfully."

      - name: Build APK
        working-directory: android-project
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FK-Share-APK
          path: android-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

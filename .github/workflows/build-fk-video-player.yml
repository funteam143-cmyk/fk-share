name: Build FK Video Player APK

on:
  workflow_dispatch:
  push:
    paths:
      - "FKVideoPlayer/**"
      - ".github/workflows/build-fk-video-player.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FKVideoPlayer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FKVideoPlayer-debug
          path: FKVideoPlayer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

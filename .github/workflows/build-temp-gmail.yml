name: Build Temp Gmail APK

on:
  push:
    paths:
      - "TempGmail/**"
      - ".github/workflows/build-temp-gmail.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: TempGmail
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Temp-Gmail-debug-APK
          path: TempGmail/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
